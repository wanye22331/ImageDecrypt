name: Android自动打包Release
# 代码推送到main分支自动执行打包
on:
  push:
    branches: [ main ]
  # 网页手动触发打包
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - name: 检出源码
        uses: actions/checkout@v4

      # 2. 配置JDK17（安卓标准编译环境）
      - name: 设置JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 配置Android SDK
      - name: 安装Android SDK组件
        uses: android-actions/setup-android@v3

      # 4. 缓存Gradle依赖，加快打包速度
      - name: 缓存Gradle依赖
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 5. 执行编译打包，生成Release包
      - name: Gradle编译Release APK
        run: ./gradlew assembleRelease

      # 6. 上传打包产物APK
      - name: 上传APK安装包
        uses: actions/upload-artifact@v4
        with:
          name: ImageDecrypt-Release-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
